<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gift box character -->
  <g transform="translate(4, 4)">
    <!-- Box body -->
    <rect x="2" y="14" width="32" height="24" rx="3" fill="#F2541B"/>
    <rect x="2" y="14" width="32" height="24" rx="3" fill="url(#boxGrad)"/>
    <!-- Box lid -->
    <rect x="0" y="10" width="36" height="8" rx="3" fill="#D43E0E"/>
    <!-- Vertical ribbon -->
    <rect x="15" y="10" width="6" height="28" fill="#E8B84B"/>
    <!-- Ribbon on lid -->
    <rect x="15" y="10" width="6" height="8" fill="#D4A017"/>
    <!-- Bow knot -->
    <ellipse cx="12" cy="7" rx="6" ry="4" fill="#E8B84B" opacity="0.95"/>
    <ellipse cx="24" cy="7" rx="6" ry="4" fill="#E8B84B" opacity="0.95"/>
    <circle cx="18" cy="7" r="3" fill="#D4A017"/>
    <!-- Eyes -->
    <circle cx="13" cy="24" r="1.8" fill="#FFFBF5"/>
    <circle cx="23" cy="24" r="1.8" fill="#FFFBF5"/>
    <circle cx="13.5" cy="24" r="0.9" fill="#2A2220"/>
    <circle cx="23.5" cy="24" r="0.9" fill="#2A2220"/>
    <!-- Smile -->
    <path d="M14 29 Q18 32 22 29" stroke="#FFFBF5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Blush -->
    <circle cx="10" cy="27" r="1.5" fill="#FF9B7A" opacity="0.6"/>
    <circle cx="26" cy="27" r="1.5" fill="#FF9B7A" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="52" y="22" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" fill="#2A2220">CORPORATE</text>
  <text x="52" y="38" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" fill="#F2541B">KHUSHIYAAN</text>
  <defs>
    <linearGradient id="boxGrad" x1="2" y1="14" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7449"/>
      <stop offset="1" stop-color="#F2541B"/>
    </linearGradient>
  </defs>
</svg>
